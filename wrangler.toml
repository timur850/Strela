name = "strela"
main = "worker.js"
compatibility_date = "2025-09-01"
# чтобы воркеры одного аккаунта (STRELA STARS ↔ STRELA CASE) могли обращаться друг к другу по *.workers.dev
compatibility_flags = ["global_fetch_strictly_public"]
# не стирать переменные, добавленные в панели Cloudflare
keep_vars = true

[assets]
directory = "./site"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[triggers]
crons = ["*/5 * * * *"]
